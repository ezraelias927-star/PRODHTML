<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} | Core Digital Past Papers</title>
    <style>
        :root {
            --primary-blue: #0d6efd;
            --dark-blue: #0a4b9a;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --text-dark: #212529;
            --accent-orange: #fd7e14;
            --border-color: #dee2e6;
            --danger-red: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. NAVBAR STYLES */
        .navbar {
            background-color: var(--dark-blue);
            color: var(--white);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-brand span {
            color: var(--accent-orange);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        .btn-logout {
            background-color: var(--danger-red);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            color: var(--white) !important;
        }

        .btn-logout:hover {
            background-color: #bb2d3b;
        }

        /* 2. MAIN CONTENT WRAPPER */
        .main-wrapper {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* 3. FOOTER STYLES */
        .footer {
            background-color: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 1rem 0;
            margin-top: auto;
            font-size: 0.85rem;
            border-top: 3px solid var(--accent-orange);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
                padding: 1rem;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVBAR START -->
    <nav class="navbar">
        <a href="/admin" class="navbar-brand">
            CORE <span>DIGITAL</span> | Admin Panel
        </a>
        <ul class="nav-links">
            <li><a href="/admin">Dashboard</a></li>
            <li><a href="/admin/courses">Kozi & Masomo</a></li>
            <li><a href="/admin/upload">Upload Paper</a></li>
            <li><a href="/" target="_blank">View Website</a></li>
            <li><a href="/admin/logout" class="btn-logout">Logout</a></li>
        </ul>
    </nav>
    <!-- NAVBAR END -->

    <!-- DYNAMIC CONTENT BLOCK -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER START -->
    <footer class="footer">
        <p>&copy; 2026 Core Digital Systems. All Rights Reserved.</p>
    </footer>
    <!-- FOOTER END -->

    {% block extra_js %}{% endblock %}
</body>
</html>
