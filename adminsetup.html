{% extends 'adminbase.html' %}

{% block title %}Setup ya Awali{% endblock %}

{% block content %}
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;">

    <!-- 1. FORM YA KOZI -->
    <div style="background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #dee2e6;">
        <h3 style="color: #0a4b9a; margin-bottom: 1rem;">1. Sajili Kozi</h3>
        <form id="formCourse">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: bold;">Code ya Kozi:</label>
                <input type="text" id="course_code" placeholder="OD19-CE" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: bold;">Jina la Kozi:</label>
                <input type="text" id="course_title" placeholder="Civil Engineering" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <button type="submit" style="width: 100%; padding: 0.6rem; background: #0d6efd; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Hifadhi Kozi</button>
        </form>
    </div>

    <!-- 2. FORM YA MWAKA WA MASOMO -->
    <div style="background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #dee2e6;">
        <h3 style="color: #0a4b9a; margin-bottom: 1rem;">2. Sajili Mwaka wa Masomo</h3>
        <form id="formYear">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: bold;">Mwaka (Label):</label>
                <input type="text" id="year_label" placeholder="2023/2024" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <button type="submit" style="width: 100%; padding: 0.6rem; background: #0d6efd; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Hifadhi Mwaka</button>
        </form>
    </div>

    <!-- 3. FORM YA AINA YA MTIHANI -->
    <div style="background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #dee2e6;">
        <h3 style="color: #0a4b9a; margin-bottom: 1rem;">3. Sajili Aina ya Mtihani</h3>
        <form id="formExam">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: bold;">Aina ya Mtihani:</label>
                <input type="text" id="exam_name" placeholder="UE / Mid-Semester" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <button type="submit" style="width: 100%; padding: 0.6rem; background: #0d6efd; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Hifadhi Mtihani</button>
        </form>
    </div>

</div>

<script>
// Helper function ya kutuma data kwa fetch
function sendData(url, data, formId) {
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        alert("Imefanikiwa kurekodi!");
        document.getElementById(formId).reset();
    })
    .catch(err => alert("Imeshindikana kutuma data!"));
}

// 1. Kozi Event
document.getElementById('formCourse').addEventListener('submit', function(e) {
    e.preventDefault();
    sendData('/api/courses', {
        code: document.getElementById('course_code').value,
        title: document.getElementById('course_title').value
    }, 'formCourse');
});

// 2. Mwaka Event
document.getElementById('formYear').addEventListener('submit', function(e) {
    e.preventDefault();
    sendData('/api/academic-years', {
        year_label: document.getElementById('year_label').value
    }, 'formYear');
});

// 3. Aina ya Mtihani Event
document.getElementById('formExam').addEventListener('submit', function(e) {
    e.preventDefault();
    sendData('/api/exam-types', {
        name: document.getElementById('exam_name').value
    }, 'formExam');
});
</script>
{% endblock %}
