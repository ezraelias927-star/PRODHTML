{% extends 'adminbase.html' %}

{% block title %}Sajili Kozi{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; border: 1px solid #dee2e6;">
    <h2 style="color: #0a4b9a; margin-bottom: 1.5rem;">Sajili Kozi Mpya</h2>

    <form id="courseForm">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Code ya Kozi:</label>
            <input type="text" id="code" placeholder="Mfano: OD19-CE" required style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Jina la Kozi:</label>
            <input type="text" id="title" placeholder="Mfano: Civil Engineering" required style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <button type="submit" style="width: 100%; padding: 0.7rem; background: #0d6efd; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Hifadhi Kozi
        </button>
    </form>
</div>

<script>
document.getElementById('courseForm').addEventListener('submit', function(e) {
    e.preventDefault();

    let data = {
        code: document.getElementById('code').value,
        title: document.getElementById('title').value
    };

    fetch('/api/courses', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        alert("Kozi imehifadhiwa!");
        document.getElementById('courseForm').reset();
    })
    .catch(error => {
        alert("Kuna tatizo limetokea!");
    });
});
</script>
{% endblock %}
