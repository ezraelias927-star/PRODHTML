<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Past Papers Repository{% endblock %} | Core Digital</title>
    <style>
        :root {
            --primary-blue: #0d6efd;
            --dark-blue: #0a4b9a;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --text-dark: #212529;
            --accent-orange: #fd7e14;
            --border-color: #dee2e6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR STYLES */
        .navbar {
            background-color: var(--dark-blue);
            padding: 0.9rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
        }

        .navbar-brand span {
            color: var(--accent-orange);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        .btn-admin {
            border: 1px solid var(--accent-orange);
            padding: 0.35rem 0.8rem;
            border-radius: 4px;
            color: var(--accent-orange) !important;
        }

        .btn-admin:hover {
            background: var(--accent-orange);
            color: var(--white) !important;
        }

        /* MAIN WRAPPER */
        .container {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* FOOTER */
        .footer {
            background-color: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 1.2rem 0;
            margin-top: auto;
            font-size: 0.85rem;
            border-top: 3px solid var(--accent-orange);
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 0.8rem;
                padding: 1rem;
            }
            .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVBAR START -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            CORE <span>PAPERS</span>
        </a>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/courses">Courses</a></li>
            <li><a href="/request-paper">Omba Paper</a></li>
            <li><a href="/admin" class="btn-admin">Admin Portal</a></li>
        </ul>
    </nav>
    <!-- NAVBAR END -->

    <!-- DYNAMIC CONTENT -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER START -->
    <footer class="footer">
        <p>&copy; 2026 Core Digital Repository. All Rights Reserved.</p>
    </footer>
    <!-- FOOTER END -->

    {% block extra_js %}{% endblock %}
</body>
</html>
