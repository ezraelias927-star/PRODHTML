{% extends "base.html" %}

{% block title %}Tafuta Past Papers - Core Papers{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            
            <!-- Hero Section & Search Bar -->
            <h1 class="fw-bold mb-3">Tafuta Past Papers Live</h1>
            <p class="text-muted mb-4">Anza kuandika jina la somo au code ili kupata matokeo papo hapo.</p>
            
            <div class="input-group mb-3 shadow-sm">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Andika hapa (mf. CSE, Mathematics, Physics...)" autocomplete="off">
            </div>

            <!-- Sehemu ya Kuonyesha Matokeo Live (Yatajitegemea hapa chini) -->
            <div id="searchResults" class="list-group text-start shadow-sm mt-3">
                <!-- Matokeo ya search yatajipanga hapa automatically kupitia JavaScript -->
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Weka anwani ya server yako ya backend (kama ipo localhost au kwenye IP nyingine)
    const BACKEND_URL = 'http://127.0.0.1:5000';

    document.getElementById('searchInput').addEventListener('input', function() {
        const query = this.value.trim();
        const resultsContainer = document.getElementById('searchResults');

        // Kama kisanduku kiko wazi, safisha matokeo
        if (query === '') {
            resultsContainer.innerHTML = '';
            return;
        }

        // Tuma ombi kwenda kwenye Search API ya Backend moja kwa moja
        fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                resultsContainer.innerHTML = ''; // Safisha matokeo ya zamani

                if (data.length === 0) {
                    resultsContainer.innerHTML = `<div class="list-group-item text-muted py-3">Hakuna past paper iliyopatikana kwa jina hili.</div>`;
                    return;
                }

                // Zungusha matokeo yote yaliyopatikana na uyachomeke kwenye UI
                data.forEach(paper => {
                    resultsContainer.innerHTML += `
                        <a href="${BACKEND_URL}/static/uploads/papers/${paper.filename}" target="_blank" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="mb-1 fw-bold text-dark">📄 ${paper.filename}</h6>
                                <small class="text-muted">Bonyeza kufungua au kupakua PDF</small>
                            </div>
                            <span class="badge bg-primary rounded-pill px-3 py-2">Download</span>
                        </a>
                    `;
                });
            })
            .catch(err => {
                console.error('Kosa la mtandao wakati wa kutafuta:', err);
            });
    });
</script>
{% endblock %}
